
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6efe4;
            color: #3e3025;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #fffaf2;
            padding: 38px;
            border: 1px solid #e4d3bd;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(75, 49, 28, 0.10);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #704b2e;
            font-size: 27px;
            margin-bottom: 9px;
        }

        .heading p {
            color: #8b7967;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #59432f;
        }

        input, select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #ddcbb5;
            border-radius: 6px;
            background: #fffdf9;
            color: #3e3025;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #91643e;
            box-shadow: 0 0 0 2px rgba(145, 100, 62, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #805735;
            color: #fffaf2;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover {
            background: #624127;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #968575;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>Student Registration</h1>
            <p>Enter your details to register</p>
        </div>

        <form action="/register" method="POST">

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll"
                       placeholder="Enter your roll number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select your course</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech CSE Data Science">B.Tech CSE Data Science</option>
                    <option value="B.Tech IT">B.Tech IT</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                </select>
            </div>

            <button type="submit">Submit Registration</button>

        </form>

    

    </div>

</body>
</html>
